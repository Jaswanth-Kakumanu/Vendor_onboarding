name: Validate VendorFlow
on: [push, pull_request]
jobs:
  policy-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest -q
      - run: python -m compileall -q vendorflow
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the actual application
        shell: bash
        run: |
          export CHROMIUM_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          gunicorn 'vendorflow.app:create_app()' --bind 127.0.0.1:8000 --workers 1 --threads 4 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1)
                  break
              except OSError:
                  time.sleep(.2)
          else:
              raise RuntimeError('Server failed to become ready')
          PY
          python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
